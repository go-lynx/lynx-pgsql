# PgSQL Plugin Configuration Example
# Driver must be "pgx" (this plugin uses jackc/pgx via database/sql).

lynx:
  pgsql:
    # Database driver name (use "pgx" for this plugin)
    driver: "pgx"

    # Database connection string
    # Format: postgres://username:password@host:port/database?sslmode=disable
    source: ""  # Inject DSN from environment-specific config or a secret manager

    # Connection pool configuration
    # Minimum number of idle connections (enables pool warmup when set)
    min_conn: 10

    # Maximum number of open connections
    max_conn: 50

    # Optional: maximum idle connections (overrides min_conn for idle cap when set)
    # max_idle_conn: 10

    # Maximum idle time for connections (idle connections exceeding this are closed)
    max_idle_time: "30s"

    # Maximum connection lifetime (connections exceeding this are closed and recreated)
    max_life_time: "300s"

    # Optional: ensure pool is alive before handing out (default: true). When true, GetDB/GetValidatedConn
    # validate the pool/connection so business never gets a closed or broken connection.
    # ensure_alive_before_handout: true

# Advanced configuration example
#  lynx:
#   pgsql:
#     driver: "pgx"
#     source: ""  # e.g. injected postgres DSN with sslmode=require
#     min_conn: 5
#     max_conn: 100
#     max_idle_time: "60s"
#     max_life_time: "600s"

